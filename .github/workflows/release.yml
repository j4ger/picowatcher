name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example: v1.0.0)'
        required: true
        type: string
      make_latest:
        description: 'Mark this release as latest'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag exists
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "Tag '${{ inputs.tag }}' does not exist. Create and push it before running this workflow."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          make_latest: ${{ inputs.make_latest }}
