name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example: v1.0.0)'
        required: true
        type: string
      target:
        description: 'Target commit-ish (branch, SHA, or tag)'
        required: false
        default: ''
        type: string
      make_latest:
        description: 'Mark this release as latest'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.target != '' && inputs.target || github.sha }}
          generate_release_notes: true
          make_latest: ${{ inputs.make_latest && 'true' || 'false' }}
